   <g id="text_1">
    <text style="fill: #17263c; font: 700 29px 'DejaVu Sans'; text-anchor: start" x="36" y="61.888906" transform="rotate(-0, 36, 61.888906)">Here4 → Pixhawk → Orange Pi</text>
   </g>
   <g id="text_2">
    <text style="fill: #52637b; font: 17px 'DejaVu Sans'; text-anchor: start" x="36" y="96.850937" transform="rotate(-0, 36, 96.850937)">CAN1 carries GNSS data. TELEM2 carries XRCE-DDS over a three-wire UART link.</text>
   </g>
   <g id="text_3">
