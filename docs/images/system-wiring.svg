   <g id="text_31">
    <text style="fill: #bd3d32; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="57.6" y="579.184531" transform="rotate(-0, 57.6, 579.184531)">UART: 3.3 V logic. Leave TELEM2 pin 1 (+5 V), pin 4 (CTS), and pin 5 (RTS) disconnected.</text>
   </g>
   <g id="text_32">
    <text style="fill: #17263c; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="36" y="648.304531" transform="rotate(-0, 36, 648.304531)">Power the Orange Pi separately. Here4 is powered through the Pixhawk CAN1 cable.</text>
   </g>
   <g id="text_33">
    <text style="fill: #52637b; font: 14px 'DejaVu Sans'; text-anchor: start" x="36" y="684.263125" transform="rotate(-0, 36, 684.263125)">Logical connections, not connector-face ordering. Locate pin 1 using the manufacturer diagrams before wiring.</text>
   </g>
   <g id="text_34">
